name: Engine integrity and support tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blink-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Fetch immutable extracted baseline if shallow checkout needs it
        env:
          BLINK_BASELINE_GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B standalone/tools/automation.py ensure-baseline
      - name: Verify pristine upstream source
        run: python3 -B standalone/tools/blink.py verify
      - name: Test integration and provenance tools
        run: python3 -B -m unittest discover -s standalone/tests -v
      - name: Validate version and release preflight
        run: python3 -B standalone/tools/automation.py release-plan
      - name: Upload release readiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-${{ github.sha }}
          path: standalone/out/automation/release-plan.json
          if-no-files-found: ignore
          retention-days: 14
